[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buffer-ai-content-operations"
version = "0.1.0"
description = "Multi-Agent Content Operations Platform: transforms GitHub releases into verified, human-governed LinkedIn drafts via Buffer API & CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Philippe Godfroy", email = "philippe.godfroy@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[project.scripts]
content-ops = "buffer_content_ops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/buffer_content_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
